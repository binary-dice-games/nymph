#
# Publishes the nymph web app, the web viewer and its demo page to GitHub
# Pages (spec/15_web_app/DESIGN.md section 6):
#   https://binary-dice-games.github.io/nymph/        the app
#   https://binary-dice-games.github.io/nymph/demo/   the demo page
# One-time setup: Settings > Pages > Source: GitHub Actions. Google Drive in
# the app: the repository variables NYMPH_GOOGLE_CLIENT_ID,
# NYMPH_GOOGLE_API_KEY and NYMPH_GOOGLE_APP_ID (docs/web-app.md); without
# them the app shows no Drive control.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.12

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          npm install --no-save --prefix "$GITHUB_WORKSPACE" playwright@1.56
          npx --prefix "$GITHUB_WORKSPACE" playwright install --with-deps chromium
      - name: Build the site
        env:
          GOOGLE_CLIENT_ID: ${{ vars.NYMPH_GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ vars.NYMPH_GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ vars.NYMPH_GOOGLE_APP_ID }}
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -G Ninja -DNYMPH_WEB=ON -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DNYMPH_SITE_COMMIT="$GITHUB_SHA" \
            -DNYMPH_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" -DNYMPH_GOOGLE_API_KEY="$GOOGLE_API_KEY" \
            -DNYMPH_GOOGLE_APP_ID="$GOOGLE_APP_ID"
          cmake --build build-web --parallel
      - name: Test the site
        run: ctest --test-dir build-web --output-on-failure -j2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/web/site
      - id: deployment
        uses: actions/deploy-pages@v4
