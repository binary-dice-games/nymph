# MIT License © 2026 Binary Dice Games
#
# Updates the install channels once a maintainer publishes the draft
# release that release.yml made (spec/07_release_pipeline/DESIGN.md
# section 5, docs/releasing.md):
#
# check (the published files, against their SHA256SUMS) -> plugin,
# homebrew, winget, chrome, npm -> mcp-registry. Prereleases update no channel. Run it by hand
# with a tag to retry the channels of a published release; every job
# does nothing a second time. A channel whose secret is missing is
# skipped with a warning.

name: channels

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: channels-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # The channels pin the files the release publishes, so they read them
  # from the release itself, not from release.yml's artifacts.
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Published release files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
            { echo "tag $TAG is not vX.Y.Z: a prerelease updates no channel" >&2; exit 1; }
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] ||
            { echo "release $TAG is a draft or a prerelease: no channel is updated" >&2; exit 1; }
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          (cd release && sha256sum -c SHA256SUMS)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  plugin:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Token
        id: gate
        env:
          TOKEN: ${{ secrets.NYMPH_RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::NYMPH_RELEASE_TOKEN not set: the plugin is not pinned to this release (docs/releasing.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.NYMPH_RELEASE_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.ready == 'true'
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Pin the release in a pull request
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.NYMPH_RELEASE_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          branch="release/plugin-v$VERSION"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq '.[0].number' | grep -q .; then
            echo "the pull request for $branch exists already"
            exit 0
          fi
          cmake -DSOURCE_DIR="$PWD" -DVERSION="$VERSION" -DSUMS="$RUNNER_TEMP/release/SHA256SUMS" \
            -P cmake/NymphPluginSync.cmake
          if git diff --quiet; then
            echo "the plugin already pins $VERSION"
            exit 0
          fi
          git config user.name "nymph release"
          git config user.email "nymph-release@users.noreply.github.com"
          git checkout -b "$branch"
          git add claude/plugin/.claude-plugin/plugin.json claude/plugin/bin/checksums.txt \
            cursor/plugin/.cursor-plugin/plugin.json cursor/plugin/bin/checksums.txt
          git commit -m "Claude Code and Cursor plugins: pin nymph $VERSION"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --title "Claude Code and Cursor plugins: pin nymph $VERSION" \
            --body "Pins the executables of the nymph $VERSION release in the Claude Code and Cursor plugins and sets their version (spec/07_release_pipeline/DESIGN.md section 4.5). Opened by the release workflow."
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --auto --squash ||
            echo "::warning::auto-merge is off for this repository: merge the pull request by hand"

  homebrew:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set: the tap is not updated (docs/releasing.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          repository: ${{ github.repository_owner }}/homebrew-nymph
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.ready == 'true'
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Push the formula to the tap
        if: steps.gate.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p tap/Formula
          sh .github/scripts/homebrew-formula.sh "$VERSION" "$RUNNER_TEMP/release/SHA256SUMS" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" tap/Formula/nymph.rb
          cd tap
          if git diff --quiet -- Formula/nymph.rb && git ls-files --error-unmatch Formula/nymph.rb > /dev/null 2>&1; then
            echo "the tap already has nymph $VERSION"
            exit 0
          fi
          git config user.name "nymph release"
          git config user.email "nymph-release@users.noreply.github.com"
          git add Formula/nymph.rb
          git commit -m "nymph $VERSION"
          git push

  # Opens a pull request on microsoft/winget-pkgs from the token owner's fork
  # (WINGET_FORK, default <owner>/winget-pkgs); winget's bot validates it and
  # Microsoft merges it. The first one is a new-package submission, reviewed by hand.
  winget:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Token
        id: gate
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::WINGET_TOKEN not set: no winget pull request is opened (docs/releasing.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.ready == 'true'
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Open the winget pull request
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          FORK: ${{ vars.WINGET_FORK || format('{0}/winget-pkgs', github.repository_owner) }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          branch="nymph-$VERSION"
          dir=manifests/b/BinaryDiceGames/Nymph/$VERSION
          fork_owner=${FORK%%/*}
          if [ -n "$(gh pr list --repo microsoft/winget-pkgs --head "$fork_owner:$branch" --state all --json number --jq '.[].number')" ]; then
            echo "a winget pull request for nymph $VERSION already exists"
            exit 0
          fi
          # A shallow, sparse copy of upstream: winget-pkgs is very large.
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:$GH_TOKEN@github.com/$FORK.git" winget-pkgs
          cd winget-pkgs
          git sparse-checkout set "$dir"
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch --quiet --depth 1 upstream master
          git checkout --quiet -b "$branch" FETCH_HEAD
          cd ..
          sh .github/scripts/winget-manifest.sh "$VERSION" "$RUNNER_TEMP/release/SHA256SUMS" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" "winget-pkgs/$dir"
          if command -v winget > /dev/null 2>&1; then
            winget validate --manifest "winget-pkgs/$dir"
          else
            echo "::warning::winget is not on this runner: manifests not validated here"
          fi
          cd winget-pkgs
          if [ -z "$(git status --porcelain -- "$dir")" ]; then
            echo "winget-pkgs already has nymph $VERSION"
            exit 0
          fi
          git config user.name "nymph release"
          git config user.email "nymph-release@users.noreply.github.com"
          git add "$dir"
          git commit --quiet -m "New version: BinaryDiceGames.Nymph version $VERSION"
          git push --quiet origin "$branch"
          gh pr create --repo microsoft/winget-pkgs --head "$fork_owner:$branch" --base master \
            --title "New version: BinaryDiceGames.Nymph version $VERSION" \
            --body "nymph $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG. Opened by the release workflow."

  chrome:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Credentials
        id: gate
        env:
          ITEM: ${{ vars.CHROME_EXTENSION_ID }}
          PUBLISHER: ${{ vars.CHROME_PUBLISHER_ID }}
          REFRESH: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$ITEM" ] || [ -z "$PUBLISHER" ] || [ -z "$REFRESH" ]; then
            echo "::warning::Chrome Web Store not configured (CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID, CHROME_* secrets): the extension is not published (docs/releasing.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.ready == 'true'
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Upload and submit for review
        if: steps.gate.outputs.ready == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: sh packaging/chrome/publish.sh "$RUNNER_TEMP/release/nymph-extension-${{ needs.check.outputs.version }}.zip"

  # The npm package @binary-dice-games/nymph (.github/scripts/npm-package.sh):
  # the launcher `npx -y @binary-dice-games/nymph mcp` runs in any MCP client.
  # Published with NPM_TOKEN, or, once the package exists and npm trusts this
  # workflow, by trusted publishing (vars.NPM_TRUSTED_PUBLISHING = true).
  npm:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Credentials
        id: gate
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ -z "$TOKEN" ] && [ "$TRUSTED" != true ]; then
            echo "::warning::NPM_TOKEN not set and NPM_TRUSTED_PUBLISHING not true: the npm package is not published (docs/releasing.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.ready == 'true'
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Publish the package
        id: publish
        if: steps.gate.outputs.ready == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sh .github/scripts/npm-package.sh "$VERSION" "$RUNNER_TEMP/release/SHA256SUMS" "$RUNNER_TEMP/npm"
          if [ "$(npm view "@binary-dice-games/nymph@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "npm already has @binary-dice-games/nymph $VERSION"
          else
            (cd "$RUNNER_TEMP/npm/package" && npm publish --access public --provenance)
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  # The MCP Registry entry io.github.binary-dice-games/nymph, pointing at
  # the npm package; GitHub OIDC proves the namespace, so no secret.
  mcp-registry:
    needs: [check, npm]
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: mcp-publisher, checked against its signature
        working-directory: ${{ runner.temp }}
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish the server entry
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sh .github/scripts/npm-package.sh "$VERSION" "$RUNNER_TEMP/release/SHA256SUMS" "$RUNNER_TEMP/npm"
          cd "$RUNNER_TEMP/npm"
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          if ! "$RUNNER_TEMP/mcp-publisher" publish > publish.log 2>&1; then
            cat publish.log
            grep -qi "already" publish.log || exit 1
            echo "the MCP Registry already has nymph $VERSION"
          fi
          cat publish.log
