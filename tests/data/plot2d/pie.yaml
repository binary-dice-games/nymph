description: Market share by region.
image: {width: 360, height: 360}
root:
  type: Plot
  title: Share
  flags: Equal
  x_flags: NoDecorations
  y_flags: NoDecorations
  x_min: 0
  x_max: 1
  y_min: 0
  y_max: 1
  children:
    - {type: PlotPieChart, labels: $region, values: $share, normalize: true, label_fmt: "%.0f%%"}
data:
  region: [North, South, East, West]
  share: [35, 25, 22, 18]
